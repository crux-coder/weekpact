<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Two-tone: the smaller tick is the cream fill, the larger is the ink mark, the
       same pairing a completed day uses. The cream carries its own derived outline. -->
  <defs>
    <path id="back3" d="M 150 372 L 352 716 L 580 388"/>
    <path id="front3" d="M 470 560 L 654 724 L 868 276"/>
  </defs>
  <rect width="1024" height="1024" fill="#8AC9EC"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#back3" stroke="#BABBBA" stroke-width="116" transform="translate(0,26)"/>
    <use href="#front3" stroke="#484848" stroke-width="132" transform="translate(0,26)"/>
    <use href="#back3" stroke="#B0B1B0" stroke-width="132"/>
    <use href="#back3" stroke="#F5F6F5" stroke-width="116"/>
    <use href="#front3" stroke="#191B19" stroke-width="132"/>
  </g>
</svg>
