name: weekpact
description: "WeekPact: keep weekly pacts with your crew."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  url_launcher: 6.3.2
  app_links: 7.2.1
  image_picker: 1.2.3
  firebase_core: 4.14.0
  firebase_messaging: 16.6.0
  hugeicons: 1.1.7
  shared_preferences: 2.5.5
  supabase_flutter: 2.17.2
  card_swiper: 3.0.1
  share_plus: 13.3.0
  firebase_crashlytics: 5.3.0
  qr_flutter: 4.1.0
  camera: 0.12.1
  purchases_flutter: 10.12.0
  purchases_ui_flutter: 10.12.0
  flutter_timezone: ^5.1.0
  app_settings: ^9.0.0
  sign_in_with_apple: 8.2.0
  google_sign_in: 7.2.0
  crypto: 3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - shaders/progressive_blur.frag

  uses-material-design: true

  fonts:
    # One face for the whole app, in the four weights the type scale uses:
    # 400 body, 500 label, 600 emphasis, 700 display. Nothing above 700 ships,
    # because nothing above 700 is asked for.
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
